    <style>
      :root {
        color-scheme: light;
        --teal: #22989a;
        --teal-dark: #13777a;
        --orange: #f47b20;
        --yellow: #ffd43b;
        --ink: #242424;
        --paper: #fffdf7;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--teal);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Yu Gothic", "Noto Sans JP", sans-serif;
        background:
          radial-gradient(circle at 14% 12%, rgba(255, 212, 59, 0.3) 0 4px, transparent 5px),
          radial-gradient(circle at 86% 18%, rgba(255, 255, 255, 0.35) 0 5px, transparent 6px),
          linear-gradient(145deg, #2aa4a6, #177f82);
      }

      main {
        width: min(100% - 32px, 760px);
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .card {
        overflow: hidden;
        border: 4px solid var(--ink);
        border-radius: 28px;
        background: var(--paper);
        box-shadow: 12px 14px 0 rgba(24, 44, 44, 0.35);
      }

      .hero {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
      }

      .content {
        padding: 28px clamp(20px, 6vw, 48px) 36px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.75rem, 7vw, 2.6rem);
        line-height: 1.25;
        letter-spacing: 0.04em;
      }

      .lead {
        margin: 0 auto 28px;
        font-size: clamp(1rem, 4vw, 1.15rem);
        line-height: 1.8;
      }

      .actions {
        display: grid;
        gap: 14px;
      }

      .button {
        display: flex;
        min-height: 56px;
        align-items: center;
        justify-content: center;
        padding: 14px 18px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        color: #fff;
        font-weight: 800;
        font-size: 1rem;
        line-height: 1.3;
        text-decoration: none;
        box-shadow: 0 5px 0 var(--ink);
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .button:hover {
        transform: translateY(2px);
        box-shadow: 0 3px 0 var(--ink);
      }

      .button:active {
        transform: translateY(5px);
        box-shadow: none;
      }

      .button--share {
        background: #111;
      }

      .button--site {
        background: var(--orange);
      }

      .sub-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 20px;
        margin-top: 24px;
      }

      .text-link {
        color: var(--teal-dark);
        font-weight: 700;
        text-underline-offset: 4px;
      }

      .event-note {
        margin: 30px 0 0;
        padding-top: 22px;
        border-top: 2px dashed #b8b4a7;
        color: #555;
        font-size: 0.9rem;
        line-height: 1.7;
      }

      footer {
        margin-top: 24px;
        color: rgba(255, 255, 255, 0.95);
        text-align: center;
        font-size: 0.8rem;
        line-height: 1.7;
      }

      @media (min-width: 640px) {
        main {
          padding-top: 48px;
        }

        .actions {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }
      }
    </style>

      </footer>

    <script>
      (() => {
        const shareButton = document.querySelector("#share-on-x");
        const pageUrl = "https://clear.kibf.tatami-studio.games/";
        const shareText = [
